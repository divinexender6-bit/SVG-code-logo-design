<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DXL Logo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #02060b;

            overflow: hidden;

            font-family: Arial, sans-serif;
        }

        .logo-container {
            position: relative;

            width: 500px;
            height: 500px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Blue glow */

        .glow {
            position: absolute;

            width: 330px;
            height: 330px;

            background: #008cff;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.3;

            animation: glow 3s infinite ease-in-out;
        }

        /* SVG */

        svg {
            width: 450px;
            height: 450px;

            position: relative;

            filter:
                drop-shadow(0 0 8px #008cff)
                drop-shadow(0 0 20px #008cff);
        }

        /* Outer circle */

        .outer-circle {
            fill: #03080e;

            stroke: #008cff;

            stroke-width: 5;
        }

        /* Inner circle */

        .inner-circle {
            fill: none;

            stroke: #008cff;

            stroke-width: 2;

            opacity: 0.25;
        }

        /* DXL */

        .dxl {
            fill: white;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 155px;

            font-weight: 900;

            letter-spacing: -25px;

            text-anchor: middle;

            dominant-baseline: middle;

            paint-order: stroke fill;

            stroke: #008cff;

            stroke-width: 3;

            filter:
                drop-shadow(0 0 5px white)
                drop-shadow(0 0 12px #008cff);
        }

        /* Small blue line */

        .accent {
            stroke: #008cff;

            stroke-width: 4;

            stroke-linecap: round;

            opacity: 0.8;
        }

        /* Brand name */

        .brand {
            position: absolute;

            bottom: -5px;

            color: white;

            font-size: 30px;

            font-weight: 900;

            letter-spacing: 10px;

            text-shadow:
                0 0 8px #008cff,
                0 0 20px #008cff;
        }

        /* Tagline */

        .tagline {
            position: absolute;

            bottom: -30px;

            color: #008cff;

            font-size: 8px;

            letter-spacing: 5px;

            font-weight: bold;
        }

        /* Glow animation */

        @keyframes glow {

            0%, 100% {
                transform: scale(0.9);
                opacity: 0.2;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.35;
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            .logo-container {
                width: 350px;
                height: 400px;
            }

            svg {
                width: 350px;
                height: 350px;
            }

            .dxl {
                font-size: 120px;
            }

            .brand {
                font-size: 25px;
            }
        }

    </style>

</head>

<body>


    <div class="logo-container">

        <div class="glow"></div>


        <svg
            viewBox="0 0 500 500"
            xmlns="http://www.w3.org/2000/svg"
        >

            <!-- Main circle -->

            <circle
                class="outer-circle"
                cx="250"
                cy="250"
                r="205"
            />


            <!-- Inner circle -->

            <circle
                class="inner-circle"
                cx="250"
                cy="250"
                r="180"
            />


            <!-- DXL -->

            <text
                class="dxl"
                x="250"
                y="250"
            >
                YDX
            </text>


            <!-- Small accent -->

            <line
                class="accent"
                x1="170"
                y1="350"
                x2="330"
                y2="350"
            />

        </svg>


        <div class="brand">
            YDX
        </div>


        <div class="tagline">
            DIGITAL LEGACY
        </div>

    </div>


    <script>

        const logo =
            document.querySelector("svg");

        const glow =
            document.querySelector(".glow");


        document.addEventListener(
            "mousemove",
            function(event) {

                const x =
                    (event.clientX /
                    window.innerWidth - 0.5) * 8;

                const y =
                    (event.clientY /
                    window.innerHeight - 0.5) * 8;


                logo.style.transform =
                    `translate(${x}px, ${y}px)`;


                glow.style.transform =
                    `translate(${x / 2}px, ${y / 2}px)`;

            }
        );


        document.addEventListener(
            "mouseleave",
            function() {

                logo.style.transform = "";

                glow.style.transform = "";

            }
        );

    </script>

</body>
</html>
